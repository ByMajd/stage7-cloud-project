name: Build and Deploy Stage 7

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/stage7-backend:latest

      - name: Build and push chatbot image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.chatbot
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/stage7-chatbot:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure VM
        uses: azure/cli@v2
        with:
          inlineScript: |
            az vm run-command invoke \
              --resource-group "${{ secrets.RESOURCE_GROUP_NAME }}" \
              --name "${{ secrets.VM_NAME }}" \
              --command-id RunShellScript \
              --scripts "sudo -u azureuser -H bash /home/azureuser/stage6-app/update_app.sh"